<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolf Studios Produções</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --silver: #c0c0c0;
            --silver-dim: #888;
            --red-wolf: #cc1a1a;
            --bg: #0a0a0a;
            --bg-card: #111111;
            --bg-card-hover: #1a1a1a;
            --border: rgba(255,255,255,0.07);
            --text: #e5e5e5;
            --text-muted: #888;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── HEADER ── */
        header {
            background: rgba(10,10,10,0.95);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
        }
        .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-img { height: 56px; width: auto; border-radius: 4px; }
        .logo-group { display: flex; align-items: center; gap: 1rem; }
        .logo-name { display: flex; flex-direction: column; line-height: 1.1; }
        .logo-name-main {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.55rem;
            letter-spacing: 0.1em;
            color: #fff;
        }
        .logo-name-sub {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 0.22em;
            color: var(--silver-dim);
        }
        .logo-text {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: 0.08em;
            color: #fff;
            line-height: 1;
        }
        .logo-text span { color: var(--red-wolf); }

        /* ── NAV ── */
        nav {
            background: rgba(10,10,10,0.9);
            border-bottom: 1px solid var(--border);
        }
        .nav-inner {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
            display: flex;
            justify-content: center;
            gap: 0;
        }
        .nav-link {
            display: inline-block;
            padding: 0.875rem 1.5rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            transition: color 0.2s, border-color 0.2s;
            border-bottom: 2px solid transparent;
        }
        .nav-link:hover { color: #fff; }
        .active-nav-link { color: #fff !important; border-bottom: 2px solid var(--red-wolf); }

        /* ── MAIN ── */
        #content-area {
            max-width: 1280px;
            margin: 0 auto;
            padding: 3rem 1.5rem 5rem;
        }

        /* ── HOME HERO ── */
        .hero {
            text-align: center;
            padding: 5rem 0 4rem;
        }
        .hero-eyebrow {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--red-wolf);
            margin-bottom: 1.5rem;
        }
        .hero-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(3.5rem, 10vw, 7rem);
            line-height: 0.95;
            letter-spacing: 0.02em;
            color: #fff;
            margin-bottom: 1.5rem;
        }
        .hero-title em {
            font-style: normal;
            color: var(--silver);
        }
        .hero-sub {
            font-size: 1rem;
            color: var(--text-muted);
            max-width: 480px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }
        .hero-divider {
            width: 48px;
            height: 2px;
            background: var(--red-wolf);
            margin: 0 auto 3rem;
        }
        .hero-badges {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .badge {
            padding: 0.5rem 1.25rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        /* ── SECTION HEADER ── */
        .section-header {
            margin-bottom: 2.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }
        .section-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 0.05em;
            color: #fff;
        }
        .section-count {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--red-wolf);
            text-transform: uppercase;
        }

        /* ── VIDEO CARDS ── */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }
        .video-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
            transition: border-color 0.2s, background 0.2s;
        }
        .video-card:hover {
            border-color: rgba(255,255,255,0.15);
            background: var(--bg-card-hover);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
        }
        .video-wrapper iframe,
        .video-wrapper video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
            background: #000;
        }
        .video-info {
            padding: 1rem 1.25rem;
        }
        .video-tag {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--red-wolf);
            margin-bottom: 0.4rem;
        }
        .video-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.4;
        }

        /* ── HQ VIEWER ── */
        .hq-list { display: flex; flex-direction: column; gap: 1.5rem; }
        .hq-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .hq-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .hq-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red-wolf); }
        .hq-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
        .hq-viewer-wrap {
            position: relative;
            padding-bottom: 75%;
            height: 0;
            overflow: hidden;
        }
        .hq-viewer-wrap iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        /* ── CONTACT ── */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
            margin-top: 0.5rem;
        }
        .contact-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 1.5rem;
            transition: border-color 0.2s;
        }
        .contact-card:hover { border-color: rgba(255,255,255,0.15); }
        .contact-card-label {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--red-wolf);
            margin-bottom: 0.6rem;
        }
        .contact-card-value {
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
        }
        .contact-card-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }
        .contact-btn {
            display: inline-block;
            margin-top: 0.875rem;
            padding: 0.5rem 1rem;
            background: var(--red-wolf);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            text-decoration: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            border-radius: 2px;
            transition: opacity 0.2s;
        }
        .contact-btn:hover { opacity: 0.85; }
        .contact-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .contact-btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }

        /* ── ADMIN (mesmos tokens visuais do site) ── */
        .admin-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .admin-field { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.875rem; }
        .admin-field label {
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.15em;
            text-transform: uppercase; color: var(--text-muted);
        }
        .admin-field input[type="text"],
        .admin-field input[type="url"] {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 2px;
            padding: 0.6rem 0.75rem;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
        }
        .admin-field input[type="file"] { font-size: 0.8rem; color: var(--text-muted); }
        .admin-field input:focus { outline: none; border-color: var(--red-wolf); }
        .admin-progress { height: 4px; background: var(--border); border-radius: 2px; margin-top: 0.875rem; overflow: hidden; display: none; }
        .admin-progress > div { height: 100%; width: 0; background: var(--red-wolf); transition: width 0.15s; }
        .admin-status { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.6rem; min-height: 1.1em; }
        .admin-status.err { color: #ff6b6b; }
        .admin-list { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.875rem; }
        .admin-item {
            display: flex; align-items: center; justify-content: space-between; gap: 1rem;
            padding: 0.6rem 0.75rem; background: var(--bg); border: 1px solid var(--border); border-radius: 2px;
            font-size: 0.85rem; color: #fff;
        }
        .admin-item small { color: var(--text-muted); display: block; font-size: 0.7rem; }
        .admin-del {
            background: transparent; border: 1px solid var(--border); color: var(--red-wolf);
            font-family: inherit; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
            text-transform: uppercase; padding: 0.35rem 0.7rem; border-radius: 2px; cursor: pointer;
        }
        .admin-del:hover { border-color: var(--red-wolf); }
        .empty-msg { color: var(--text-muted); font-size: 0.9rem; }

        /* ── FOOTER ── */
        footer {
            border-top: 1px solid var(--border);
            padding: 1.5rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }
        footer a { color: inherit; text-decoration: none; opacity: 0.6; }
        footer a:hover { opacity: 1; }
    </style>
</head>
<body>

    <header>
        <div class="header-inner">
            <div class="logo-group">
                <!-- Coloque o arquivo da logo ao lado deste index.html com o nome logo.jpg
                     (ou cole de volta o base64 original da logo neste src). -->
                <img src="logo.jpg" alt="Wolf Studios Logo" class="logo-img">
                <div class="logo-name">
                    <span class="logo-name-main">WOLF STUDIOS</span>
                    <span class="logo-name-sub">PRODUÇÕES</span>
                </div>
            </div>
        </div>
    </header>

    <nav>
        <div class="nav-inner">
            <a href="#" onclick="renderPage('home', this); return false;" class="nav-link active-nav-link" data-page="home">Home</a>
            <a href="#" onclick="renderPage('videos', this); return false;" class="nav-link" data-page="videos">Vídeos</a>
            <a href="#" onclick="renderPage('hqs', this); return false;" class="nav-link" data-page="hqs">Quadrinhos</a>
            <a href="#" onclick="renderPage('contato', this); return false;" class="nav-link" data-page="contato">Contato</a>
        </div>
    </nav>

    <main id="content-area"></main>

    <footer>
        <span>© 2025 Wolf Studios Produções — Todos os direitos reservados</span>
        <span> · <a href="#" onclick="renderPage('admin', null); return false;">Admin</a></span>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, serverTimestamp
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import {
            getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

        /* ════════════════════════════════════════════════
           CONFIGURAÇÃO — cole aqui o firebaseConfig do seu
           projeto (Console Firebase > Configurações do projeto
           > Seus apps > App da Web)
           ════════════════════════════════════════════════ */
        const firebaseConfig = {
            apiKey: "COLE_AQUI",
            authDomain: "COLE_AQUI",
            projectId: "COLE_AQUI",
            storageBucket: "COLE_AQUI",
            messagingSenderId: "COLE_AQUI",
            appId: "COLE_AQUI"
        };

        // Único e-mail com permissão de gerenciar o site
        const ADMIN_EMAIL = "jeffersonaugusto706@gmail.com";

        const WHATSAPP_NUMBER = "41998984617";
        const HQ_ID = "1MNOY87hM2jTRGI96DqBpuooe-hhmuwOz";

        const configured = !Object.values(firebaseConfig).some(v => String(v).includes("COLE_AQUI"));
        let auth, db, storage;
        if (configured) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            storage = getStorage(app);
        }

        // Conteúdo original (continua aparecendo)
        const staticVideos = [
            { titulo: "Doctor Who fanfilm minisode", id: "lFqCWO2hfYc", tag: "Fan Film", type: "youtube" }
        ];
        const staticHqs = [
            { titulo: "Leitor de HQ", url: `https://drive.google.com/uc?export=download&id=${HQ_ID}` }
        ];

        let currentPage = 'home';
        let currentUser = null;

        const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const isAdmin = () => !!currentUser && currentUser.email === ADMIN_EMAIL && currentUser.emailVerified;

        function youtubeId(input) {
            const m = String(input).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);
            return m ? m[1] : (/^[\w-]{11}$/.test(input) ? input : null);
        }

        async function loadItems(name) {
            if (!configured) return [];
            try {
                const snap = await getDocs(query(collection(db, name), orderBy("createdAt", "desc")));
                return snap.docs.map(d => ({ _id: d.id, ...d.data() }));
            } catch (e) { console.error(e); return []; }
        }

        const pages = {
            home: () => `
                <div class="hero">
                    <span class="hero-eyebrow">Wolf Studios Produções</span>
                    <h1 class="hero-title">Criatividade<br><em>sem Limites</em></h1>
                    <div class="hero-divider"></div>
                    <p class="hero-sub">Vídeos, quadrinhos e histórias que saem do ordinário. Produção independente com alma.</p>
                    <div class="hero-badges">
                        <span class="badge">Fan Films</span>
                        <span class="badge">Quadrinhos</span>
                        <span class="badge">Produção Independente</span>
                    </div>
                </div>
            `,
            videos: () => `
                <div class="section-header">
                    <h2 class="section-title">Vídeos</h2>
                    <span class="section-count" id="video-count"></span>
                </div>
                <div class="video-grid" id="video-grid"></div>
            `,
            hqs: () => `
                <div class="section-header">
                    <h2 class="section-title">Quadrinhos</h2>
                </div>
                <div class="hq-list" id="hq-list"></div>
            `,
            contato: () => `
                <div class="section-header">
                    <h2 class="section-title">Contato</h2>
                </div>
                <div class="contact-grid">
                    <div class="contact-card">
                        <p class="contact-card-label">WhatsApp</p>
                        <p class="contact-card-value">(41) 99898-4617</p>
                        <p class="contact-card-sub">Atendimento via mensagem</p>
                        <a class="contact-btn" href="https://wa.me/${WHATSAPP_NUMBER}" target="_blank" rel="noopener">Enviar mensagem</a>
                    </div>
                </div>
            `,
            admin: () => `
                <div class="section-header">
                    <h2 class="section-title">Gerenciamento</h2>
                    <span class="section-count">Área restrita</span>
                </div>
                <div id="admin-root"></div>
            `
        };

        function videoCardHTML(v) {
            const media = v.type === 'file'
                ? `<video controls preload="metadata" src="${esc(v.url)}"></video>`
                : `<iframe src="https://www.youtube.com/embed/${esc(v.id)}" allowfullscreen loading="lazy"></iframe>`;
            return `
                <div class="video-wrapper">${media}</div>
                <div class="video-info">
                    <p class="video-tag">${esc(v.tag || 'Vídeo')}</p>
                    <h3 class="video-title">${esc(v.titulo)}</h3>
                </div>`;
        }

        function hqCardHTML(h) {
            const viewer = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(h.url)}`;
            return `
                <div class="hq-header">
                    <span class="hq-dot"></span>
                    <span class="hq-label">${esc(h.titulo || 'Leitor de HQ')}</span>
                </div>
                <div class="hq-viewer-wrap">
                    <iframe src="${viewer}" allowfullscreen loading="lazy"></iframe>
                </div>`;
        }

        async function fillVideos() {
            const grid = document.getElementById('video-grid');
            const uploaded = await loadItems('videos');
            const all = [...uploaded, ...staticVideos];
            document.getElementById('video-count').textContent =
                `${all.length} produç${all.length !== 1 ? 'ões' : 'ão'}`;
            all.forEach(v => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.innerHTML = videoCardHTML(v);
                grid.appendChild(card);
            });
        }

        async function fillHqs() {
            const list = document.getElementById('hq-list');
            const uploaded = await loadItems('hqs');
            [...uploaded, ...staticHqs].forEach(h => {
                const card = document.createElement('div');
                card.className = 'hq-card';
                card.innerHTML = hqCardHTML(h);
                list.appendChild(card);
            });
        }

        /* ───────────── ADMIN ───────────── */
        function setStatus(id, msg, err) {
            const el = document.getElementById(id);
            if (el) { el.textContent = msg; el.className = 'admin-status' + (err ? ' err' : ''); }
        }

        function uploadFile(file, folder, onProgress) {
            return new Promise((resolve, reject) => {
                const path = `${folder}/${Date.now()}_${file.name.replace(/[^\w.\-]/g, '_')}`;
                const task = uploadBytesResumable(ref(storage, path), file, { contentType: file.type });
                task.on('state_changed',
                    s => onProgress(s.bytesTransferred / s.totalBytes),
                    reject,
                    async () => resolve({ url: await getDownloadURL(task.snapshot.ref), path })
                );
            });
        }

        function bindUpload({ formId, barId, statusId, btnId, run }) {
            const form = document.getElementById(formId);
            form.addEventListener('submit', async e => {
                e.preventDefault();
                const btn = document.getElementById(btnId);
                const bar = document.getElementById(barId);
                btn.disabled = true; bar.style.display = 'block'; bar.firstElementChild.style.width = '0';
                setStatus(statusId, 'Enviando…');
                try {
                    await run(new FormData(form), p => bar.firstElementChild.style.width = (p * 100).toFixed(0) + '%');
                    form.reset();
                    setStatus(statusId, 'Publicado com sucesso!');
                    await renderAdminLists();
                } catch (err) {
                    console.error(err);
                    setStatus(statusId, 'Erro: ' + (err.message || err), true);
                } finally {
                    btn.disabled = false;
                    setTimeout(() => { bar.style.display = 'none'; }, 800);
                }
            });
        }

        async function renderAdminLists() {
            const [vids, hqs] = await Promise.all([loadItems('videos'), loadItems('hqs')]);
            const row = (col, it, sub) => `
                <div class="admin-item">
                    <div>${esc(it.titulo)}<small>${esc(sub)}</small></div>
                    <button class="admin-del" data-col="${col}" data-id="${esc(it._id)}" data-path="${esc(it.storagePath || '')}">Excluir</button>
                </div>`;
            document.getElementById('admin-videos').innerHTML = vids.length
                ? vids.map(v => row('videos', v, `${v.type === 'file' ? 'Arquivo' : 'YouTube'} · ${v.tag || 'Vídeo'}`)).join('')
                : '<p class="empty-msg">Nenhum vídeo enviado ainda.</p>';
            document.getElementById('admin-hqs').innerHTML = hqs.length
                ? hqs.map(h => row('hqs', h, 'PDF')).join('')
                : '<p class="empty-msg">Nenhuma HQ enviada ainda.</p>';

            document.querySelectorAll('.admin-del').forEach(b => b.onclick = async () => {
                if (!confirm('Excluir este item definitivamente?')) return;
                b.disabled = true;
                try {
                    if (b.dataset.path) { try { await deleteObject(ref(storage, b.dataset.path)); } catch (e) { console.warn(e); } }
                    await deleteDoc(doc(db, b.dataset.col, b.dataset.id));
                    await renderAdminLists();
                } catch (e) { alert('Erro ao excluir: ' + e.message); b.disabled = false; }
            });
        }

        function renderAdmin() {
            const root = document.getElementById('admin-root');
            if (!configured) {
                root.innerHTML = `<div class="contact-card"><p class="contact-card-label">Configuração pendente</p>
                    <p class="contact-card-sub">Cole o firebaseConfig no início do script do index.html para ativar uploads e gerenciamento.</p></div>`;
                return;
            }
            if (!currentUser) {
                root.innerHTML = `<div class="contact-card" style="max-width:360px">
                    <p class="contact-card-label">Login</p>
                    <p class="contact-card-sub">Entre com a conta Google autorizada para gerenciar o site.</p>
                    <button class="contact-btn" id="btn-login">Entrar com Google</button></div>`;
                document.getElementById('btn-login').onclick = () =>
                    signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert('Erro no login: ' + e.message));
                return;
            }
            if (!isAdmin()) {
                root.innerHTML = `<div class="contact-card" style="max-width:360px">
                    <p class="contact-card-label">Acesso negado</p>
                    <p class="contact-card-sub">${esc(currentUser.email)} não tem permissão de gerenciamento.</p>
                    <button class="contact-btn ghost" id="btn-logout">Sair</button></div>`;
                document.getElementById('btn-logout').onclick = () => signOut(auth);
                return;
            }

            root.innerHTML = `
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;gap:1rem;flex-wrap:wrap">
                    <span class="contact-card-sub">Logado como ${esc(currentUser.email)}</span>
                    <button class="contact-btn ghost" id="btn-logout" style="margin-top:0">Sair</button>
                </div>
                <div class="admin-grid">
                    <div class="contact-card">
                        <p class="contact-card-label">Enviar vídeo</p>
                        <form id="form-video">
                            <div class="admin-field"><label>Título</label><input type="text" name="titulo" required></div>
                            <div class="admin-field"><label>Categoria</label><input type="text" name="tag" placeholder="Fan Film" ></div>
                            <div class="admin-field"><label>Arquivo de vídeo (MP4, WebM…)</label><input type="file" name="file" accept="video/*"></div>
                            <div class="admin-field"><label>ou link do YouTube</label><input type="url" name="yt" placeholder="https://youtu.be/..."></div>
                            <div class="admin-progress" id="bar-video"><div></div></div>
                            <p class="admin-status" id="st-video"></p>
                            <button class="contact-btn" id="btn-video" type="submit">Publicar vídeo</button>
                        </form>
                    </div>
                    <div class="contact-card">
                        <p class="contact-card-label">Enviar HQ</p>
                        <form id="form-hq">
                            <div class="admin-field"><label>Título</label><input type="text" name="titulo" required></div>
                            <div class="admin-field"><label>Arquivo PDF</label><input type="file" name="file" accept="application/pdf" required></div>
                            <div class="admin-progress" id="bar-hq"><div></div></div>
                            <p class="admin-status" id="st-hq"></p>
                            <button class="contact-btn" id="btn-hq" type="submit">Publicar HQ</button>
                        </form>
                    </div>
                </div>
                <div class="admin-grid">
                    <div class="contact-card"><p class="contact-card-label">Vídeos publicados</p><div class="admin-list" id="admin-videos"></div></div>
                    <div class="contact-card"><p class="contact-card-label">HQs publicadas</p><div class="admin-list" id="admin-hqs"></div></div>
                </div>`;

            document.getElementById('btn-logout').onclick = () => signOut(auth);

            bindUpload({
                formId: 'form-video', barId: 'bar-video', statusId: 'st-video', btnId: 'btn-video',
                run: async (fd, onP) => {
                    const titulo = fd.get('titulo').trim();
                    const tag = (fd.get('tag') || '').trim() || 'Vídeo';
                    const file = fd.get('file');
                    const yt = (fd.get('yt') || '').trim();
                    if (file && file.size) {
                        const { url, path } = await uploadFile(file, 'videos', onP);
                        await addDoc(collection(db, 'videos'), { titulo, tag, type: 'file', url, storagePath: path, createdAt: serverTimestamp() });
                    } else if (yt) {
                        const id = youtubeId(yt);
                        if (!id) throw new Error('Link do YouTube inválido.');
                        await addDoc(collection(db, 'videos'), { titulo, tag, type: 'youtube', id, createdAt: serverTimestamp() });
                    } else {
                        throw new Error('Envie um arquivo ou informe um link do YouTube.');
                    }
                }
            });

            bindUpload({
                formId: 'form-hq', barId: 'bar-hq', statusId: 'st-hq', btnId: 'btn-hq',
                run: async (fd, onP) => {
                    const file = fd.get('file');
                    if (!file || !file.size) throw new Error('Selecione um PDF.');
                    const { url, path } = await uploadFile(file, 'hqs', onP);
                    await addDoc(collection(db, 'hqs'), { titulo: fd.get('titulo').trim(), url, storagePath: path, createdAt: serverTimestamp() });
                }
            });

            renderAdminLists();
        }

        /* ───────────── ROTEAMENTO ───────────── */
        function renderPage(pageId, clickedElement) {
            currentPage = pageId;
            document.getElementById('content-area').innerHTML = pages[pageId]();

            if (pageId === 'videos') fillVideos();
            if (pageId === 'hqs') fillHqs();
            if (pageId === 'admin') renderAdmin();

            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active-nav-link'));
            if (clickedElement) clickedElement.classList.add('active-nav-link');
        }
        window.renderPage = renderPage;

        if (configured) {
            onAuthStateChanged(auth, user => {
                currentUser = user;
                if (currentPage === 'admin') renderAdmin();
            });
        }

        renderPage('home', document.querySelector('[data-page="home"]'));
    </script>
</body>
</html>
