<script>
    const STORAGE_KEY = "wolf_studios_catalog_v7";
    const AUTH_KEY = "wolf_studios_admin_logged";

    const defaultCatalog = [
        {
            id: "hq-mascara-1",
            title: "A Máscara da Vingança — Parte 1 (A Origem do Bicho-Papão)",
            category: "HQs",
            sourceType: "gdrive",
            url: "https://drive.google.com/file/d/1bJiYFm_gJj5riQAhvt-3ckh2xwkmK895/view?usp=sharing",
            thumbnail: "https://drive.google.com/thumbnail?id=1bJiYFm_gJj5riQAhvt-3ckh2xwkmK895&sz=w800",
            description: "Arthur Henry abandonou o passado como assassino de aluguel, mas as sombras da cidade e a máscara amaldiçoada exigem um último acerto de contas.",
            date: "2026"
        },
        {
            id: "hq-mascara-2",
            title: "A Máscara da Vingança — Parte 2",
            category: "HQs",
            sourceType: "gdrive",
            url: "https://drive.google.com/file/d/1cgn_yEHPC69E75kBXEoA-bt5CHPNp3i5/view?usp=sharing",
            thumbnail: "https://drive.google.com/thumbnail?id=1cgn_yEHPC69E75kBXEoA-bt5CHPNp3i5&sz=w800",
            description: "Três meses depois da batalha anterior, Arthur retorna às ruas para cobrar cada dívida.",
            date: "2026"
        },
        {
            id: "hq-dw-skorm",
            title: "Doctor Who: A Extinção Skorm",
            category: "HQs",
            sourceType: "gdrive",
            url: "https://drive.google.com/file/d/1MNOY87hM2jTRGI96DqBpuooe-hhmuwOz/view?usp=sharing",
            thumbnail: "https://drive.google.com/thumbnail?id=1MNOY87hM2jTRGI96DqBpuooe-hhmuwOz&sz=w800",
            description: "Uma invasão ilegal no planeta Skorm coloca uma criança em risco e força o Doutor a agir.",
            date: "2026"
        },
        {
            id: "hq-dw-novo-capitulo",
            title: "Doctor Who: Um Novo Capítulo Se Inicia",
            category: "HQs",
            sourceType: "gdrive",
            url: "https://drive.google.com/file/d/1DLtLS1P6fnBLIWJNsr2Ss1AjhHxC_AHa/view?usp=sharing",
            thumbnail: "https://drive.google.com/thumbnail?id=1DLtLS1P6fnBLIWJNsr2Ss1AjhHxC_AHa&sz=w800",
            description: "Com a chave sônica destruída e a TARDIS danificada, o Doutor enfrenta novos perigos.",
            date: "2026"
        }
    ];

    let catalog = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultCatalog;
    let currentTab = "todos";

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll(".nav-btn").forEach(btn => {
            btn.classList.toggle("active", btn.dataset.tab === tab);
        });

        const titles = {
            "todos": "Catálogo Completo",
            "Filmes": "Filmes & Produções Live-Action",
            "HQs": "Histórias em Quadrinhos (WCU)",
            "Animações": "Animações Originais"
        };
        const secTitle = document.getElementById("sectionTitle");
        const heroSec = document.getElementById("heroSection");
        
        if (secTitle) secTitle.textContent = titles[tab] || tab;
        if (heroSec) heroSec.style.display = tab === "todos" ? "block" : "none";
        renderCatalog();
    }

    function renderCatalog() {
        const grid = document.getElementById("catalogGrid");
        const searchInput = document.getElementById("searchInput");
        if (!grid) return;

        const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

        const filtered = catalog.filter(item => {
            const matchTab = currentTab === "todos" || item.category === currentTab;
            const matchQuery = item.title.toLowerCase().includes(query) || item.description.toLowerCase().includes(query);
            return matchTab && matchQuery;
        });

        if (filtered.length === 0) {
            grid.innerHTML = `<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 3rem 0;">Nenhuma produção encontrada.</p>`;
            return;
        }

        grid.innerHTML = filtered.map(item => {
            const isHQ = item.category === "HQs";
            let sourceLabel = "YouTube";
            if (item.sourceType === "globalcomics") sourceLabel = "Global Comics";
            else if (item.sourceType === "gdrive") sourceLabel = "Google Drive";
            else if (item.sourceType === "hq-pages" || item.sourceType === "pdf") sourceLabel = "Leitor HQ";

            const actionText = isHQ ? "Ler Edição &rarr;" : "Assistir Agora &rarr;";

            return `
                <article class="media-card">
                    <div class="card-thumb ${isHQ ? 'hq-ratio' : ''}" onclick="openMedia('${item.id}')">
                        <div class="card-tags">
                            <span class="tag tag-cat">${item.category}</span>
                            <span class="tag tag-src">${sourceLabel}</span>
                        </div>
                        <img src="${item.thumbnail}" alt="${item.title}" onerror="this.src='https://images.unsplash.com/photo-1612036782180-6f0b6cd846fe?auto=format&fit=crop&w=800&q=80'">
                        <div class="play-overlay">
                            <div class="play-circle">${isHQ ? '&#128214;' : '&#9654;'}</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div>
                            <h4 class="card-title">${item.title}</h4>
                            <p class="card-desc">${item.description}</p>
                        </div>
                        <div class="card-footer">
                            <span>Wolf Studios &bull; ${item.date || '2026'}</span>
                            <button class="watch-link" onclick="openMedia('${item.id}')">${actionText}</button>
                        </div>
                    </div>
                </article>
            `;
        }).join("");
    }

    function convertDriveUrl(url) {
        if (!url) return "";
        const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
        if (match && match[1]) {
            return `https://drive.google.com/file/d/${match[1]}/preview`;
        }
        return url;
    }

    function openMedia(id) {
        const item = catalog.find(i => i.id === id);
        if (!item) return;

        const modal = document.getElementById("mediaModal");
        const title = document.getElementById("mediaModalTitle");
        const body = document.getElementById("mediaModalBody");

        if (title) title.textContent = item.title;

        if (item.category === "HQs" && item.sourceType === "gdrive") {
            const embedUrl = convertDriveUrl(item.url);
            body.innerHTML = `
                <iframe class="hq-pdf-frame" src="${embedUrl}" allow="autoplay"></iframe>
                <p style="margin-top: 1rem; color: var(--text-secondary);">${item.description}</p>
            `;
        } else if (item.sourceType === "youtube") {
            const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?|shorts)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
            const match = item.url.match(regExp);
            const ytId = match ? match[1] : null;
            const embedUrl = ytId ? `https://www.youtube.com/embed/${ytId}?autoplay=1&rel=0` : item.url;
            body.innerHTML = `
                <div class="player-wrapper">
                    <iframe src="${embedUrl}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <p style="color: var(--text-secondary);">${item.description}</p>
            `;
        } else {
            const embedUrl = convertDriveUrl(item.url);
            body.innerHTML = `
                <div class="player-wrapper">
                    <iframe src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>
                </div>
                <p style="color: var(--text-secondary);">${item.description}</p>
            `;
        }

        if (modal) modal.classList.add("open");
    }

    function closeMediaModal() {
        const modal = document.getElementById("mediaModal");
        const body = document.getElementById("mediaModalBody");
        if (modal) modal.classList.remove("open");
        if (body) body.innerHTML = "";
    }

    function openAdminModal() {
        const modal = document.getElementById("adminModal");
        const body = document.getElementById("adminModalBody");
        const isLogged = sessionStorage.getItem(AUTH_KEY) === "true";

        if (!isLogged) {
            body.innerHTML = `
                <div class="admin-auth-box">
                    <h4 style="font-family: var(--font-display); font-size: 1.2rem; margin-bottom: 0.8rem; color: var(--accent-gold);">Acesso Restrito ao Estúdio</h4>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem;">Digite a senha de administrador para gerenciar o catálogo da Wolf Studios.</p>
                    <div id="adminAlert" class="alert-msg alert-error"></div>
                    <div class="form-group">
                        <label for="adminPasswordInput">Senha de Acesso</label>
                        <input type="password" id="adminPasswordInput" class="form-control" placeholder="Digite a senha..." onkeydown="if(event.key === 'Enter') verifyAdminPassword()">
                    </div>
                    <button class="btn-primary" style="width: 100%; justify-content: center;" onclick="verifyAdminPassword()">Entrar no Painel</button>
                </div>
            `;
        } else {
            renderAdminDashboard(body);
        }

        if (modal) modal.classList.add("open");
    }

    function verifyAdminPassword() {
        const input = document.getElementById("adminPasswordInput");
        const alertBox = document.getElementById("adminAlert");
        if (!input) return;

        if (input.value.trim() === "9165") {
            sessionStorage.setItem(AUTH_KEY, "true");
            renderAdminDashboard(document.getElementById("adminModalBody"));
        } else {
            if (alertBox) {
                alertBox.textContent = "Senha incorreta. Acesso negado.";
                alertBox.style.display = "block";
            }
        }
    }

    function closeAdminModal() {
        const modal = document.getElementById("adminModal");
        if (modal) modal.classList.remove("open");
    }

    function renderAdminDashboard(container) {
        if (!container) return;
        container.innerHTML = `
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                <span style="color: var(--accent-gold); font-weight: 600; font-size: 0.9rem;">&#128275; Modo Administrador Ativo</span>
                <button class="btn-secondary" style="padding: 0.4rem 0.9rem; font-size: 0.8rem;" onclick="logoutAdmin()">Bloquear Painel</button>
            </div>
            <p style="color: var(--text-secondary); text-align: center; padding: 2rem 0;">Painel de controle ativo. As produções padrão estão fixas no código para visualização de todos os visitantes.</p>
        `;
    }

    function logoutAdmin() {
        sessionStorage.removeItem(AUTH_KEY);
        openAdminModal();
    }

    window.onload = function() {
        renderCatalog();
    };
</script>
