<!-- Seção Pública: Catálogo visível para TODOS os visitantes -->
<section id="catalogo-publico">
    <h2>Catálogo Wolf Studios</h2>
    <div id="lista-hqs-publicas">
        <!-- As HQs cadastradas pelo Firebase aparecem aqui automaticamente para qualquer pessoa -->
    </div>
</section>

<!-- Botão Discreto de Acesso do Administrador -->
<div style="margin-top: 30px; text-align: center;">
    <button onclick="tentarEntrarAdmin()" style="background: transparent; border: none; color: #555; cursor: pointer; font-size: 12px;">
        ⚙️ Área Restrita
    </button>
</div>

<!-- Painel de Gerenciamento / Postagem: 100% Privado (Invisível por padrão) -->
<div id="painel-admin-privado" style="display: none; border: 2px dashed #ff4444; padding: 20px; margin-top: 20px;">
    <h3>Painel de Controle - Wolf Studios (Restrito)</h3>
    
    <!-- Formulário para postar nova HQ -->
    <form id="form-postagem">
        <input type="text" id="titulo-hq" placeholder="Título da HQ" required><br><br>
        <input type="text" id="link-drive-hq" placeholder="Link de Leitura do Google Drive" required><br><br>
        <button type="submit">Publicar HQ para o Público</button>
    </form>
</div>

<script>
    // Função para desbloquear o painel com a senha 9165
    function tentarEntrarAdmin() {
        let senhaSalva = sessionStorage.getItem("wolf_admin_autenticado");
        
        if (senhaSalva === "true") {
            mostrarAdmin();
            return;
        }

        let senhaDigitada = prompt("Digite a senha de administrador:");
        if (senhaDigitada === "9165") {
            sessionStorage.setItem("wolf_admin_autenticado", "true");
            mostrarAdmin();
            alert("Bem-vindo de volta, Chefe!");
        } else if (senhaDigitada !== null) {
            alert("Senha incorreta!");
        }
    }

    function mostrarAdmin() {
        document.getElementById("painel-admin-privado").style.display = "block";
    }

    // Ao carregar o site, verifica se o admin já estava logado nesta sessão
    window.onload = function() {
        if (sessionStorage.getItem("wolf_admin_autenticado") === "true") {
            mostrarAdmin();
        }
        // Aqui você chama a sua função do Firebase para carregar as HQs publicamente
        carregarHQsPublicas();
    };
</script>
